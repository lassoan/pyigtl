# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Upload Python Package

on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine

    - name: Set build version from release tag
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        TAG="${RELEASE_TAG#v}"
        if [ -z "$TAG" ]; then
          echo "Release tag is empty"
          exit 1
        fi
        echo "Using package version: $TAG"
        echo "PYIGTL_RELEASE_VERSION=$TAG" >> "$GITHUB_ENV"

    - name: Build distribution artifacts
      run: python -m build

    - name: Check distribution artifacts
      run: twine check dist/*

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: twine upload --non-interactive --skip-existing dist/*
